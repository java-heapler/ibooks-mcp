[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-books"
version = "0.1.0"
description = "Read-only Apple Books library, EPUB/PDF text, and annotations for agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Heupler" }]
dependencies = ["EbookLib>=0.19,<0.21", "beautifulsoup4>=4.12,<5"]

[project.scripts]
apple-books = "apple_books.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_books"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
